name: Backend CI

on:
  push:
    paths:
      - backend/**
      - shared/**
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - shared/**

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

  test:
    needs: lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      # Drift guard: the schemas are the contract source of truth, so the
      # committed shared/openapi.json must match what they generate. Uses plain
      # diff (not git) so it works regardless of the runner's git-repo context.
      - name: Check shared/openapi.json is up to date
        run: |
          cp ../shared/openapi.json /tmp/openapi.committed.json
          python scripts/export_openapi.py
          if ! diff -u /tmp/openapi.committed.json ../shared/openapi.json; then
            echo "::error::shared/openapi.json is stale. Run 'python scripts/export_openapi.py' and commit."
            exit 1
          fi
