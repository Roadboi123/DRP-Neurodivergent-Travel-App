name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.builder

# Least privilege: build/push uses Docker Hub creds, not the GitHub token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - run: |
          docker build -f Dockerfile.builder -t siva123134/drp10:latest .

      - run: |
          docker push siva123134/drp10:latest