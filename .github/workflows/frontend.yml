  # ─────────────────────────────────────────────
  # JOB 4 — Deploy (main branch only)
  # Vercel pulls the source and runs expo export
  # itself — no Expo quota used here at all
  # ─────────────────────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull project config (.vercel/project.json must be committed —
      # run `vercel link` once locally in frontend/ to generate it)
      - name: Pull Vercel project settings
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel builds from source — runs expo export on their servers
      # Set EXPO_TOKEN in Vercel's environment variables dashboard,
      # not here — keeps it out of GitHub secrets entirely
      - name: Build on Vercel
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Ship the Vercel-built output to production
      - name: Deploy to production
        id: deploy
        working-directory: frontend
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Print live URL
        run: echo "Live at ${{ steps.deploy.outputs.url }}"
