name: CI / CD

on:
  push:
    paths:
     - frontend/**
     - shared/**
  pull_request:
    branches: [main]
    paths:
     - frontend/**
     - shared/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Lint & typecheck
  # Runs on every push, every branch
  # ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest

    container: &builder_container
      image: siva123134/drp10:latest
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: frontend
        run: npm ci

      # API types are generated, not committed — produce them from the committed
      # shared/openapi.json before lint and typecheck (both need the file present).
      - name: Generate API types
        working-directory: frontend
        run: npm run gen:api

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit


  # ─────────────────────────────────────────────
  # JOB 2 — Test
  # Runs in builder container for consistent env
  # ─────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest

    container: *builder_container

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: frontend
        run: npm ci

      # - name: Run tests
      #   working-directory: frontend
      #   # --passWithNoTests: won't fail while test suite is still being built
      #   # Remove this flag once you have real tests
      #   run: npm test -- --passWithNoTests --watchAll=false
      #   # run: npm test -- --passWithNoTests --watchAll=false

