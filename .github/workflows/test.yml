name: CI / CD

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Lint & typecheck
  # Runs on every push, every branch
  # ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest

    container: &builder_container
      image: siva123134/drp10:latest
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: app
        run: npm ci

      - name: ESLint
        working-directory: app
        run: npm run lint

      - name: TypeScript check
        working-directory: app
        run: npx tsc --noEmit


  # ─────────────────────────────────────────────
  # JOB 2 — Test
  # Runs in builder container for consistent env
  # ─────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest

    container: *builder_container

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: app
        run: npm ci

      # - name: Run tests
      #   working-directory: app
      #   # --passWithNoTests: won't fail while test suite is still being built
      #   # Remove this flag once you have real tests
      #   run: npm test -- --passWithNoTests --watchAll=false
      #   # run: npm test -- --passWithNoTests --watchAll=false

# ─────────────────────────────────────────────
  # JOB 3 — Build
  # No EAS — plain Gradle build via expo prebuild
  # APK uploaded as artifact, download from
  # Actions run page and sideload onto any Android
  # ─────────────────────────────────────────────
  build-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Install Node deps
        working-directory: app
        run: npm ci
 
      # Cache 1 — Gradle wrapper and caches
      # Saves downloading Gradle itself (~100MB) every run
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}
 
      # Cache 2 — Gradle build cache and dependencies
      # Saves re-downloading all Android dependencies (~500MB) every run
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            app/android/.gradle
          key: gradle-deps-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-
 
      # Cache 3 — Expo prebuild output
      # If nothing in your JS or app.json changed, skip regenerating
      # the native android/ folder entirely
      - name: Cache expo prebuild
        id: cache-prebuild
        uses: actions/cache@v4
        with:
          path: app/android
          key: prebuild-${{ hashFiles('app/package.json', 'app/app.json', 'app/app.config.*') }}
 
      # Only runs expo prebuild if app.json or package.json changed
      # If the cache hit, the android/ folder is already there
      - name: Expo prebuild
        if: steps.cache-prebuild.outputs.cache-hit != 'true'
        working-directory: app
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
 
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon -Pandroid.injected.build.abi=arm64-v8a
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14



  # ─────────────────────────────────────────────
  # JOB 4 — Deploy (main branch only)
  # Vercel pulls the source and runs expo export
  # itself — no Expo quota used here at all
  # ─────────────────────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull project config (.vercel/project.json must be committed —
      # run `vercel link` once locally in app/ to generate it)
      - name: Pull Vercel project settings
        working-directory: app
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel builds from source — runs expo export on their servers
      # Set EXPO_TOKEN in Vercel's environment variables dashboard,
      # not here — keeps it out of GitHub secrets entirely
      - name: Build on Vercel
        working-directory: app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Ship the Vercel-built output to production
      - name: Deploy to production
        id: deploy
        working-directory: app
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Print live URL
        run: echo "Live at ${{ steps.deploy.outputs.url }}"