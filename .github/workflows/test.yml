name: CI / CD

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Lint & typecheck
  # Runs on every push, every branch
  # ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest

    container: &builder_container
      image: siva123134/drp10:latest
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: app
        run: npm ci

      - name: ESLint
        working-directory: app
        run: npm run lint

      - name: TypeScript check
        working-directory: app
        run: npx tsc --noEmit


  # ─────────────────────────────────────────────
  # JOB 2 — Test
  # ─────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest

    container: *builder_container

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: app
        run: npm ci

      # - name: Run tests
      #   working-directory: app
      #   run: npm test -- --passWithNoTests --watchAll=false


  # ─────────────────────────────────────────────
  # JOB 3 — Build
  # Runs expo export and uploads artifact
  # Only on main to avoid unnecessary builds
  # ─────────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    container: *builder_container

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: app
        run: npm ci

      - name: Expo export (web)
        working-directory: app
        run: npx expo export --platform web
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          # Expo outputs to dist/ by default — change to web-build/ if yours differs
          path: app/dist
          retention-days: 7


  # ─────────────────────────────────────────────
  # JOB 4 — Deploy to Netlify (main only)
  # Deploys the pre-built dist/ folder directly
  # No rebuild on Netlify's side — fast and free
  # ─────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      # Deploy the pre-built dist/ folder to Netlify production
      - name: Deploy to Netlify
        id: deploy
        run: |
          URL=$(netlify deploy \
            --dir=dist \
            --prod \
            --site=${{ secrets.NETLIFY_SITE_ID }} \
            --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --json \
            | jq -r '.deploy_url')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Print live URL
        run: echo "Live at ${{ steps.deploy.outputs.url }}"