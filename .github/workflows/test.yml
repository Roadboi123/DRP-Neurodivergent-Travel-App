name: CI / CD

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Lint & typecheck
  # Runs on every push, every branch
  # ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest

    container: &builder_container
      image: siva123134/drp10:latest
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: app
        run: npm ci

      - name: ESLint
        working-directory: app
        run: npm run lint

      - name: TypeScript check
        working-directory: app
        run: npx tsc --noEmit


  # ─────────────────────────────────────────────
  # JOB 2 — Test
  # Runs in builder container for consistent env
  # ─────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest

    container: *builder_container

    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: node-

      - name: Install Node deps
        working-directory: app
        run: npm ci

      # - name: Run tests
      #   working-directory: app
      #   # --passWithNoTests: won't fail while test suite is still being built
      #   # Remove this flag once you have real tests
      #   run: npm test -- --passWithNoTests --watchAll=false
      #   # run: npm test -- --passWithNoTests --watchAll=false

