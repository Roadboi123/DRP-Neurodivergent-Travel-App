name: Test Project

on:
  push:

env:
  NODE_VERSION: "20"

# reusable container config
x-container: &builder_container
  image: siva123134/drp10:latest
  credentials:
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_TOKEN }}

jobs:

  lint:
    runs-on: ubuntu-latest

    container: *builder_container

    steps:
      - uses: actions/checkout@v4

      - name: Install Node deps
        working-directory: app
        run: npm ci

      - name: ESLint
        working-directory: app
        run: npm run lint

      - name: TypeScript check
        working-directory: app
        run: npx tsc --noEmit


  build:
    needs: lint
    runs-on: ubuntu-latest
    container: *builder_container

    steps:
      - uses: actions/checkout@v4

      - name: Install Node deps
        working-directory: app
        run: npm ci

      - name: Expo export (web)
        working-directory: app
        run: npx expo export --platform web
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: app/dist


  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - run: echo "hello, testing!"


  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - run: echo "hello, deploying!"