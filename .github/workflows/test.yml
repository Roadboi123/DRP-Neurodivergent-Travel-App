name: Test Project

on:
  push:

env:
  NODE_VERSION: "20"

jobs:
  lint:
    runs-on: ubuntu-latest

    container: &builder_container
      image: siva123134/drp10:latest
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    steps:
     - uses: actions/checkout@v4
 
     - name: Set up Node
       uses: actions/setup-node@v4
       with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: app/package-lock.json
     - name: Install Node deps (app)
       working-directory: app
       run: npm ci

     - name: ESLint (app)
       working-directory: app
       run: npm run lint
     - name: tsc --noEmit (app)
       working-directory: app
       run: npx tsc --noEmit
      
    
  build:
    needs: lint
    runs-on: ubuntu-latest 

    container: *builder_container

    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Install Node deps (app)
        working-directory: app
        run: npm ci
 
      # Expo export — confirms the RN bundle compiles cleanly
      # Uses EXPO_TOKEN secret set in GitHub repo settings
      - name: Expo export (web + validate)
        working-directory: app
        run: npx expo export --platform web
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: build
    #TODO: get stuff from build and then test it
    steps:
      - run: echo "hello, testing!"
  
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' #TODO: test this
    #TODO: get stuff from build and then deploy
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - run: echo "hello, deploying!"
  