# Netlify config for Expo web export
# Place this file at app/netlify.toml

[build]
  # Where Expo outputs the web build
  publish = "dist"
  # Build command — Netlify runs this if deploying from source directly
  command = "npx expo export --platform web"

# Single-page app routing — all URLs serve index.html
# Without this, any route other than / returns a 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200